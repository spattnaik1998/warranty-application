name: Feature request
description: Propose a claim evaluator or product improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Assurance need
      description: Which evidence or workflow cannot be represented today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected behavior
    validations:
      required: true
