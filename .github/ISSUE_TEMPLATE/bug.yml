name: Bug report
description: Report incorrect validation behavior or a crash
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include a minimal warrant.yml and repository layout.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Warrant version
    validations:
      required: true
