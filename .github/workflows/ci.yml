name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  # Offline determinism is mandatory (PRODUCT_DIRECTION.md §6): the whole suite
  # must pass with no network and no API keys.
  WARRANT_MOCK: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: pip install ruff && ruff check .
      - name: Test
        run: python -m pytest -q

  install:
    # The headline command must work for someone who just `pip install`ed, from a
    # directory that is not the repo — this is the check that would have caught
    # `warrant audit` importing a module the wheel never shipped.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and install the wheel
        run: |
          pip install build
          python -m build --wheel
          pip install dist/*.whl
      - name: Run the CLI from outside the source tree
        run: |
          mkdir -p /tmp/elsewhere && cd /tmp/elsewhere
          warrant audit --example research
          warrant audit --example research --runs-per-month 30000
