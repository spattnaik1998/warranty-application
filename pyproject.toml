[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warrant"
version = "1.0.0"
description = "Evidence-based software assurance for Python repositories."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sarthak" }]
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
    "openai>=1.40",
    "langgraph>=1.0.10,<2",
    "langchain-core>=1.2.22,<2",
    "arxiv>=2.1",
    "pypdf>=4.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "PyYAML>=6.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[project.scripts]
warrant = "warrant.app.cli:main"

[tool.setuptools.packages.find]
include = ["warrant*"]

[tool.pytest.ini_options]
testpaths = ["warrant/tests"]
addopts = "-q"
filterwarnings = [
    "ignore:The default value of `allowed_objects`",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
