[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warrant"
version = "0.1.0"
description = "A delegation-economics SDK for multi-agent LLM systems: audit which of your agents are redundant reorganizers and prove the savings."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sarthak" }]
dependencies = [
    "pydantic>=2.6",
    "anthropic>=0.40",
    "openai>=1.40",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "arxiv>=2.1",
    "pypdf>=4.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.12"]
# Extras only the live example needs; the core SDK reads usage generically and
# imports no chat-model SDK. langchain-openai must be >=0.2 for pydantic v2 /
# langchain-core 0.3 compatibility.
live = ["langchain-openai>=0.2,<0.4"]

[project.scripts]
warrant = "warrant.app.cli:main"

[tool.setuptools.packages.find]
# The demo graphs live in warrant/examples/ so `warrant audit --example ...` works
# from a plain pip install; the repo's top-level examples/ holds runnable scripts
# and is deliberately not packaged (too generic a name to claim on PyPI).
include = ["warrant*"]

[tool.pytest.ini_options]
testpaths = ["warrant/tests"]
addopts = "-q"
filterwarnings = [
    "ignore:The default value of `allowed_objects`",
]
